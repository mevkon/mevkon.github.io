<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found | Evgeni Melnikov</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Expanded:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050506; --text: #f4f4f5; --dim: #8b8b92;
      --cyan: #16c8e8; --lime: #cdf01e; --line: rgba(255,255,255,.18);
      --display: "Archivo Expanded","Archivo",system-ui,sans-serif;
      --body: "Archivo",system-ui,sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--body);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 30px; position: relative; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(560px circle at 12% 10%, rgba(22,200,232,.16), transparent 46%),
        radial-gradient(620px circle at 88% 90%, rgba(205,240,30,.10), transparent 50%);
    }
    .box { position: relative; z-index: 1; }
    .code {
      font-family: var(--display); font-weight: 800; line-height: 1;
      font-size: clamp(5rem, 22vw, 12rem); letter-spacing: .01em;
      color: transparent; -webkit-text-stroke: 2px var(--text);
    }
    .code span { color: var(--cyan); -webkit-text-stroke: 0; }
    h1 {
      font-family: var(--display); font-weight: 800; text-transform: uppercase;
      font-size: clamp(1.2rem, 3.5vw, 1.8rem); letter-spacing: .02em; margin: 18px 0 10px;
    }
    p { color: var(--dim); margin-bottom: 34px; }
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: var(--display); font-weight: 700; font-size: .75rem;
      letter-spacing: .12em; text-transform: uppercase;
      padding: 14px 24px; border-radius: 4px;
      background: var(--cyan); color: #04161a;
      text-decoration: none; transition: transform .2s ease, background .2s ease;
    }
    .btn:hover { transform: translateY(-2px); background: var(--lime); color: #14180a; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">4<span>0</span>4</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a class="btn" href="/">← Back to portfolio</a>
  </div>
</body>
</html>
